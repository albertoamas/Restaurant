# Headers de seguridad — incluidos con `include` en el server Y en cada location que tenga su
# propio add_header: nginx NO hereda los add_header del server en una location que declara
# alguno propio (así /uploads/ se quedaba sin CSP ni HSTS).

add_header X-Frame-Options        "SAMEORIGIN"   always;
add_header X-Content-Type-Options "nosniff"      always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
# HSTS: active once HTTPS is terminated upstream (Cloudflare / Certbot)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# script-src: el sha256 es el script anti-FOUC inline de index.html (aplica el tema y el
# theme-color antes de pintar). Si ese script cambia, el hash cambia: lo verifica
# src/index-html.spec.ts, que falla con el hash nuevo a copiar aquí.
# manifest-src / worker-src caen en default-src y script-src ('self'): el manifest y el
# service worker (sw.js) se sirven desde el mismo origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-kPk769zya7gugJmLtNWq3BT3Bn7f9IMFgz8XcwKqSus=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss: https://cloudflareinsights.com;" always;
