upstream backend {
    server backend:3000;
}

# Required for WebSocket proxying: sets Connection header correctly
# when the client sends an Upgrade header (ws/wss) vs a regular HTTP request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zones — defined at http context level (this file is included inside http {})
# api:  60 req/min per IP — general API usage (POS with multiple concurrent users)
# login: 10 req/min per IP — brute-force protection on auth endpoint
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Backend accepts 10 MB image payloads; leave room for multipart overhead.
    client_max_body_size 11m;

    # Auth endpoint — strict rate limit to block brute-force
    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check proxy (no prefix)
    location /health {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Uploads proxy
    location /uploads/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        add_header         Cache-Control "public, max-age=86400, immutable";
        include            /etc/nginx/snippets/security-headers.conf;
    }

    # Socket.IO WebSocket — upgrade headers required
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # ── PWA: caché ──────────────────────────────────────────────────────────
    # sw.js, index.html y el manifest NUNCA se cachean sin revalidar: si el navegador o
    # Cloudflare guardan un sw.js viejo, los usuarios quedan atrapados en la versión vieja
    # de la app hasta que la caché expire. `no-cache` = puede guardarse, pero se revalida
    # (ETag) en cada uso: barato y siempre fresco.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include    /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        # mime.types de nginx 1.27 no conoce .webmanifest (lo serviría como octet-stream).
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include    /etc/nginx/snippets/security-headers.conf;
    }

    # También atiende "/" y el fallback del SPA (ambos terminan en /index.html).
    location = /index.html {
        add_header Cache-Control "no-cache";
        include    /etc/nginx/snippets/security-headers.conf;
    }

    # Bundles de Vite: el nombre lleva hash de contenido, así que nunca cambian.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include    /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/snippets/security-headers.conf;
}
